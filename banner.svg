<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-hidden="true">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062531"/><stop offset=".62" stop-color="#07576d"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#46adc5" stop-opacity=".55"/><stop offset="1" stop-color="#46adc5" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity=".09"/></pattern>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".55" stop-color="#000" stop-opacity="0"/></linearGradient>
<linearGradient id="bbt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70bfd2"/><stop offset="1" stop-color="#1c9ab8"/></linearGradient><linearGradient id="bbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07809d"/><stop offset="1" stop-color="#055a6e"/></linearGradient><linearGradient id="bbsh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="bbc"><path d="M32 10 L54 21 L32 32 L10 21 Z"/></clipPath>
</defs>
<style>.b1,.b2,.f,.s,.k{transform-box:fill-box;transform-origin:50% 50%}
@keyframes b1{to{transform:translate(-90px,40px) scale(1.15)}}@keyframes b2{to{transform:translate(70px,-30px) scale(.9)}}
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes s{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
@keyframes k{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.b1{animation:b1 16s ease-in-out infinite alternate}.b2{animation:b2 19s ease-in-out infinite alternate}
.f{animation:f 9s ease-in-out infinite}.f1{animation-duration:11s;animation-delay:-3s}.f2{animation-duration:13s;animation-delay:-6s}
.s{animation:s 3.4s ease-in-out infinite}.k{animation:k 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.b1,.b2,.f,.s,.k{animation:none!important}}.bbbob,.bbshadow{transform-box:fill-box;transform-origin:50% 50%}@keyframes bbb{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2px)}}@keyframes bbsd{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.86);opacity:.22}}@keyframes bbs{0%,55%{transform:translateX(0)}100%{transform:translateX(78px)}}@keyframes bbg{0%,100%{opacity:.9}50%{opacity:1}}.bbbob{animation:bbb 4.2s ease-in-out infinite}.bbshadow{animation:bbsd 4.2s ease-in-out infinite}.bbshine{animation:bbs 5.5s ease-in-out infinite}.bbglow{animation:bbg 4.2s ease-in-out infinite}</style>
<rect width="1280" height="400" fill="url(#bg)"/>
<circle class="b1" cx="1020" cy="80" r="300" fill="url(#o1)"/>
<circle class="b2" cx="260" cy="380" r="260" fill="url(#o2)"/>
<rect width="1280" height="400" fill="url(#dots)"/>
<rect width="1280" height="400" fill="url(#fade)"/>
<g transform="translate(150 92) rotate(-8) scale(2.2)"><g class="f f0" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g></g>
<g transform="translate(380 268) rotate(6) scale(1.8)"><g class="f f1" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></g></g>
<g transform="translate(640 70) rotate(-4) scale(1.5)"><g class="f f2" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></g></g>
<g class="k">
<rect x="882" y="92" width="216" height="216" rx="54" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
<g transform="translate(898 102) scale(2.85)"><g class="bbbob"><ellipse cx="32" cy="57" rx="17" ry="3.2" fill="#000" opacity=".35" class="bbshadow"/><path d="M10 21 L32 32 V54 L10 43 Z" fill="url(#bbl)"/><path d="M54 21 L32 32 V54 L54 43 Z" fill="#044655"/><path d="M32 10 L54 21 L32 32 L10 21 Z" fill="url(#bbt)"/><path d="M10 21 L32 32 L54 21" fill="none" stroke="#a9d9e4" stroke-opacity=".55" stroke-width=".8" stroke-linejoin="round"/><path d="M32 32 V54" stroke="#000" stroke-opacity=".18" stroke-width=".8"/><g clip-path="url(#bbc)"><rect class="bbshine" x="-14" y="6" width="14" height="30" fill="url(#bbsh)" transform="skewX(-25)"/></g><g transform="translate(.5 .8)"><g transform="matrix(0.8250 0.4125 -0.8250 0.4125 32 11.100)" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></g></g><g class="bbglow" transform="matrix(0.8250 0.4125 -0.8250 0.4125 32 11.100)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></g></g></g>
</g>
<g transform="translate(1040 74) scale(0.9)"><path class="s" style="animation-delay:0s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g><g transform="translate(1170 300) scale(0.6)"><path class="s" style="animation-delay:1.1s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g><g transform="translate(860 320) scale(0.5)"><path class="s" style="animation-delay:2.2s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g><g transform="translate(560 150) scale(0.45)"><path class="s" style="animation-delay:0.6s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g>
</svg>
